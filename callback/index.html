<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting… · Pusat Info Publisher</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <img src="../logo.png" alt="">
  <span class="name">Pusat Info Publisher</span>
</header>
<main>
  <h1 id="title">Finishing sign-in…</h1>
  <p class="lead" id="msg">Returning you to Pusat Info Publisher on your computer.</p>
</main>
<script>
  // TikTok sends the creator back here after login. The authorization code is handed to the publisher app
  // running on the creator's own computer; this page stores nothing.
  const q = new URLSearchParams(location.search);
  if (q.get("error")) {
    document.getElementById("title").textContent = "Sign-in was cancelled";
    document.getElementById("msg").textContent = q.get("error_description") || q.get("error");
  } else if (q.get("code")) {
    location.replace("http://127.0.0.1:5195/callback" + location.search);
  } else {
    document.getElementById("title").textContent = "Nothing to do here";
    document.getElementById("msg").textContent = "This page completes the TikTok sign-in for Pusat Info Publisher.";
  }
</script>
</body>
</html>
